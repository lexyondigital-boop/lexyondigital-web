name: Deploy to Hostinger VPS

# El panel de Hostinger solo sabe descargar una imagen ya construida -- no
# tiene forma de correr "docker build" desde un repo (su propio editor
# visual únicamente ofrece un campo "Imagen", nunca "context"/build). El
# docker-compose.yml de este proyecto antes traía "build: context: ."
# esperando que Hostinger clonara y compilara el repo él mismo al
# desplegar, pero eso nunca construía nada: cada "despliegue" quedaba en
# segundos, sin usar CPU, y sin contenedor nuevo -- confirmado comparando
# contra lexyondigital-saas, que si reconstruye de verdad porque GitHub
# Actions sube el build ya armado. Por eso ahora la imagen se construye
# aquí mismo y se sube a GitHub Container Registry; Hostinger solo la jala.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El driver "docker" por defecto no soporta cache-to: type=gha; buildx
      # necesita el driver docker-container para exportar caché a Actions.
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: lexyondigital-web
