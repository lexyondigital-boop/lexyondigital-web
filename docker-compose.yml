services:
  app:
    # Imagen ya construida y subida por GitHub Actions a GHCR -- el panel
    # de Hostinger solo sabe descargar una imagen lista, no compilarla
    # (ver .github/workflows/main.yml). "latest" porque este proyecto
    # vuelve a desplegarse en cada push a main.
    #
    # pull_policy: always es necesario porque "docker compose up -d" por sí
    # solo NO vuelve a jalar una imagen si ya existe localmente una con ese
    # tag -- se queda sirviendo el build viejo indefinidamente aunque
    # "latest" en el registro ya cambió. Confirmado en vivo: varios
    # despliegues seguidos quedaban en éxito sin que el sitio cambiara.
    image: ghcr.io/lexyondigital-boop/lexyondigital-web:latest
    pull_policy: always
    restart: always
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.lexyondigital-web.rule=Host(`lexyondigital.com.mx`) || Host(`www.lexyondigital.com.mx`)
      - traefik.http.routers.lexyondigital-web.tls=true
      - traefik.http.routers.lexyondigital-web.entrypoints=web,websecure
      - traefik.http.routers.lexyondigital-web.tls.certresolver=mytlschallenge
      - traefik.http.services.lexyondigital-web.loadbalancer.server.port=3000

networks:
  n8n_default:
    external: true
